# Agent preset "Team": one `@deepseek-ai/dsh-agent-preset` declaration, plus the
# preset-scoped plugin row that carries the fixed Team Lead / teammate base
# prompts, the on-demand playbook skills, and the locked Agent Teams mode.
#
# The child list mirrors the shipped `standard` preset with these deliberate
# differences:
#   * a `compaction` group carries automatic summarization, `/compact`, and the
#     oversized tool-result pruner, because this preset has the largest fixed
#     prompt of any preset (PTC's SDK section) and a Team session cannot finish a
#     long job without summarizing; the group isolates its services so another
#     preset cannot share them. `token-meter` and `image-offload` are NOT mounted
#     here: this profile already owns those Host-level singletons;
#   * the PTC executor replaces native tool dispatch, so `run_code` is the only
#     directly callable tool and `workflow` is disabled the way the shipped
#     `ptc` preset disables it;
#   * `@deepseek-ai/dsh-agent-team` and `@deepseek-ai/dsh-tool-agent-team` are
#     not mounted here: the Host already owns that service and those task tools,
#     and they activate per root Session from the same `team/mode` selection
#     this preset forces on.
- insert:
    # The client module scanner discovers a package's browser half through the
    # Loader rows a profile mounts, so this no-op Host row is what makes the
    # Plugins-page version card visible. It carries no Host behavior.
    - id: team-mode-client
      name: 'dsh-team-mode'
    - id: preset-team
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: team
        name: Team 模式
        description: 由 Team Lead 先定验收标准、在共享任务板上派单、队友执行，Lead 核对证据后汇总答复。
        order: 5
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: You are a coding agent powered by the {{model}} model. You work inside a DeepSeek Harness Agent Team, with a Team Lead and teammates sharing one checkout.
          - id: team-mode
            name: 'dsh-team-mode/preset'
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              applyPatch: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: tool-schedule
            name: '@deepseek-ai/dsh-tool-schedule'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              customSkillDirs:
                # The DSH bundled skills, as every shipped preset scans them.
                # This bundle's own playbooks are NOT a directory root: the preset
                # plugin registers them as scoped runtime skills, so no install
                # path ever has to be resolved here.
                - !!js process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('@deepseek-ai/dsh-agent-preset/package.json')), 'skills')
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          # Context governance. The compaction services are isolated per preset so a
          # Team session summarizes instead of failing at the context limit; the
          # `tokenMeter` service and the `image/offload` projection are Host-level
          # singletons already mounted by this profile, so mounting them here again
          # makes the whole preset fail with "already registered".
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              # Human `/compact`: one useful reduction below the automatic threshold.
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              # Trims oversized tool results before the conversation compactor runs.
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                    You are in plan mode. Stay in plan mode until the user approves your plan through exit_plan_mode or switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement - including an answer confirming something you asked - approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                    Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

                    The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

                    Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

                    Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

                    Plan the whole team's work: the plan names the shared board tasks, the teammate that owns each one, the write scopes that keep them disjoint, and the evidence that will prove each part is done. Do not create teammates or claim tasks while plan mode is active - the plan is the deliverable of this phase.

                    When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
                config:
                  interrupt: true
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelection: true
                  modelDiscovery: true
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                # PTC's run_code already orchestrates in a program; the shipped
                # `ptc` preset disables the workflow tool for the same reason.
                disabled: true
                config:
                  provider: spawn
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'
                disabled: true
          # PTC executor: the nearest scoped executor wins, so this row changes
          # only Sessions that run this preset; the Host's native executor keeps
          # serving every other preset. Under PTC only `run_code` is directly
          # callable, and the team tools appear as same-named SDK bindings.
          - id: tool-executor-ptc
            name: '@deepseek-ai/dsh-tool-executor-ptc'
            config:
              maxParallelSubCalls: 10
              maxSubCallsPerMinute: 1024
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: tool-office
            name: '@deepseek-ai/dsh-tool-office'
          - id: tool-plugin-manager
            name: '@deepseek-ai/dsh-plugin-manager/tools'
            disabled: !!js "!ctx.get('profileContext')"
